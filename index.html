<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="color-scheme" content="dark">
<title>Entrenador · Tu guía de entrenamiento personal</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrenador">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============ TEMA GENERAL Y ESCALA FLUIDA ============ */
:root{
  --bg:#0a0e13;
  --bg-elev:#0e141c;
  --card:#141c25;
  --card2:#1b2531;
  --card-hover:#202d3b;
  --line:#243241;
  --line-bright:#35495e;
  --text:#eaf0f7;
  --muted:#96a7bc;
  --accent:#ff6b35;
  --accent-soft:rgba(255,107,53,.14);
  --accent-glow:rgba(255,107,53,.35);
  --accent-ink:#1b0c04;
  --ok:#2dd4a0;
  --ok-soft:rgba(45,212,160,.14);
  --warn:#fbbf24;
  --danger:#f43f5e;
  --info:#38bdf8;
  --radius:clamp(0.95rem, 2.2vw, 1.25rem);
  --radius-sm:clamp(0.65rem, 1.5vw, 0.85rem);
  --space-xs:clamp(0.35rem, 1vw, 0.5rem);
  --space-sm:clamp(0.55rem, 1.5vw, 0.75rem);
  --space-md:clamp(0.85rem, 2.2vw, 1.15rem);
  --space-lg:clamp(1.1rem, 3vw, 1.5rem);
  --safe-b:env(safe-area-inset-bottom, 0rem);
  --safe-t:env(safe-area-inset-top, 0rem);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow-card:0 0.5rem 1.5rem -0.35rem rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  --accent2:#ff4500;
  --accent-gradient:linear-gradient(135deg, #ff6b35 0%, #ff4500 50%, #ff8c5a 100%);
  --glass:rgba(255,255,255,.04);
  --glass-border:rgba(255,255,255,.08);
  --glow-ok:rgba(45,212,160,.25);
  --shadow-glow:0 0 0 1px rgba(255,107,53,.15), 0 0.5rem 2rem -0.5rem rgba(255,107,53,.3);
  --transition-spring:cubic-bezier(.22,1,.36,1);
  --font-mono:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%;scroll-behavior:smooth}
body{
  margin:0;
  background: radial-gradient(ellipse at 20% -10%, rgba(255,107,53,.06) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 110%, rgba(56,189,248,.04) 0%, transparent 50%),
              radial-gradient(circle at 50% 0%, #141f2c 0%, var(--bg) 65%);
  color:var(--text);
  font-family:var(--font);
  font-size:clamp(0.95rem, 0.9rem + 0.25vw, 1.05rem);
  line-height:1.5;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
h1{font-size:clamp(1.5rem, 4.5vw + 0.4rem, 2.25rem);line-height:1.12;letter-spacing:-.025em;font-weight:800}
h2{font-size:clamp(1.18rem, 3vw + 0.3rem, 1.55rem);line-height:1.18;letter-spacing:-.015em;font-weight:800}
h3{font-size:clamp(1.02rem, 1.8vw + 0.3rem, 1.18rem);line-height:1.25;font-weight:700}
b,strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:clamp(0.82rem, 0.78rem + 0.2vw, 0.9rem)}
.eyebrow{
  font-size:clamp(0.7rem, 0.66rem + 0.2vw, 0.78rem);
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--accent);
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:0.4em;
}
.stack{display:grid;gap:var(--space-md)}
.row{display:flex;gap:var(--space-sm);align-items:center}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.row.center{justify-content:center}
.grow{flex:1;min-width:0}
:focus-visible{outline:0.18rem solid var(--info);outline-offset:0.15rem}
#app:focus{outline:none}

/* ============ ANIMACIONES SUTILMENTE INTEGRADAS ============ */
@keyframes cardEnter{
  from{opacity:0;transform:translateY(0.45rem)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes corePulse{
  0%,100%{opacity:.78;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
@keyframes flowDash{
  to{stroke-dashoffset:-16}
}
@keyframes floatSubtle{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-1.5px)}
}
@keyframes shimmerBar{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ============ CABECERA Y NAVEGACIÓN ============ */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(10,14,19,.82);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.04), 0 4px 24px rgba(0,0,0,.3);
  padding:calc(0.6rem + var(--safe-t)) var(--space-md) 0.6rem;
}
.topbar-in{
  max-width:65rem;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:var(--space-sm);
}
.brand{
  display:flex;
  align-items:center;
  gap:0.65rem;
  font-weight:800;
  letter-spacing:.01em;
  line-height:1.15;
  cursor:pointer;
  user-select:none;
  min-width:0;
}
.brand:hover .brand-mark{
  transform:scale(1.08) rotate(-3deg);
  box-shadow:0 0 1.5rem rgba(255,107,53,.5), 0 0 0 2px rgba(255,107,53,.2);
}
.brand-mark{
  width:clamp(2.15rem, 5vw, 2.4rem);
  height:clamp(2.15rem, 5vw, 2.4rem);
  border-radius:0.7rem;
  background:linear-gradient(135deg, #ff6b35 0%, #ff4500 50%, #ff8c5a 100%);
  box-shadow:0 0 0 0 rgba(255,107,53,.4);
  color:var(--accent-ink);
  display:grid;
  place-items:center;
  flex:none;
  transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s ease;
}
.brand small{
  display:block;
  color:var(--muted);
  font-weight:600;
  font-size:clamp(0.7rem, 0.65rem + 0.2vw, 0.76rem);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.spacer{flex:1}
.chip-time{
  display:none;
  align-items:center;
  gap:0.4rem;
  border:1px solid rgba(255,107,53,.35);
  background:linear-gradient(135deg, rgba(255,107,53,.18), rgba(255,69,0,.12));
  box-shadow:0 0 12px rgba(255,107,53,.15);
  color:var(--text);
  border-radius:99rem;
  padding:0.38rem 0.8rem;
  font-size:0.86rem;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.chip-time.on{display:inline-flex}
.chip-time:hover{background:rgba(255,107,53,.22);transform:scale(1.03)}
.tabs{display:flex;gap:0.25rem}
.tab{
  display:flex;
  align-items:center;
  gap:0.45rem;
  min-height:2.75rem;
  position:relative;
  padding:0 1rem;
  border-radius:0.75rem;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:600;
  font-size:0.88rem;
  transition:color .2s ease, background .2s ease;
  overflow:hidden;
}
.tab::after{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%) scaleX(0);
  width:60%;
  height:2px;
  background:var(--accent);
  border-radius:2px 2px 0 0;
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab[aria-current="page"]{
  background:rgba(255,107,53,.1);
  color:var(--text);
  border:1px solid rgba(255,107,53,.2);
}
.tab[aria-current="page"]::after{
  transform:translateX(-50%) scaleX(1);
}
.tab[aria-current="page"] .ic{color:var(--accent)}
main{
  max-width:65rem;
  margin:0 auto;
  padding:var(--space-md);
}
.narrow{max-width:43rem;margin:0 auto}
@media (max-width:43.75em){
  .topbar{
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    background:rgba(10,14,19,.95);
  }
  .tabs{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    background:rgba(13,19,26,.94);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:0.35rem 0.25rem calc(0.35rem + var(--safe-b));
    justify-content:space-around;
    gap:0.15rem;
  }
  .tab{
    flex:1;
    flex-direction:column;
    gap:0.18rem;
    justify-content:center;
    font-size:clamp(0.66rem, 2.5vw, 0.75rem);
    padding:0.25rem 0.15rem;
    min-height:3.25rem;
    border-radius:0.65rem;
  }
  main{padding-bottom:calc(5.8rem + var(--safe-b))}
  .brand small{display:none}
}

/* ============ BARRA DE NAVEGACIÓN Y BREADCRUMB ============ */
.nav-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--space-xs);
  margin-bottom:0.15rem;
  flex-wrap:wrap;
}
.btn-back{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  padding:0.4rem 0.9rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--glass-border);
  background:var(--glass);
  font-size:clamp(0.8rem, 0.76rem + 0.2vw, 0.88rem);
  font-weight:700;
  color:var(--muted);
  min-height:2.5rem;
  backdrop-filter:blur(8px);
  transition:border-color .15s ease, color .15s ease, background .15s ease, transform .12s ease;
}
.btn-back:hover{
  border-color:rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);
  color:var(--text);
}
.btn-back:active{transform:scale(.97)}

/* ============ TARJETAS DE RUTINAS Y SECCIONES DEL MENÚ ============ */
.cat-grid{
  display:grid;
  gap:var(--space-md);
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
}
.routine-hub{max-width:65rem;margin:0 auto;display:grid;gap:var(--space-lg)}
.routine-groups{display:grid;gap:var(--space-lg)}
.routine-group{
  display:grid;
  gap:var(--space-md);
  align-content:start;
  background:linear-gradient(170deg, rgba(20,28,37,.65) 0%, rgba(13,19,26,.85) 100%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:var(--space-md);
  box-shadow:0 0.6rem 2rem -0.4rem rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
}
.routine-group::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,107,53,.2), transparent);
  pointer-events:none;
}
.routine-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--space-sm);
  flex-wrap:wrap;
  padding-bottom:0.4rem;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.routine-group-title{
  display:flex;
  align-items:center;
  gap:0.65rem;
  min-width:0;
}
.group-badge-svg{
  width:clamp(2.5rem, 5.5vw, 2.9rem);
  height:clamp(2.5rem, 5.5vw, 2.9rem);
  border-radius:0.85rem;
  background:linear-gradient(135deg, #1b2531 0%, #10161f 100%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0.25rem 0.6rem rgba(0,0,0,.3);
  display:grid;
  place-items:center;
  flex:none;
  transition:transform .2s ease, border-color .2s ease;
}
.group-badge-svg:hover{
  transform:scale(1.05);
  border-color:rgba(255,107,53,.35);
}
.group-badge-svg svg{width:76%;height:76%}
.routine-cards{display:grid;gap:var(--space-md)}
.routine-link{
  display:grid;
  gap:0.7rem;
  padding:var(--space-md);
  text-align:left;
  width:100%;
  background:linear-gradient(160deg, var(--card2) 0%, var(--card) 100%);
  transition:transform .2s cubic-bezier(.22,1,.36,1), border-color .2s ease, box-shadow .2s ease;
  position:relative;
  overflow:hidden;
}
.routine-link::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,107,53,.03) 0%, transparent 60%);
  opacity:0;
  transition:opacity .2s ease;
  pointer-events:none;
}
.routine-link:hover::before{
  opacity:1;
}
.routine-link:hover{
  transform:translateY(-0.18rem);
  border-color:var(--accent);
  box-shadow:0 0.75rem 1.6rem -0.5rem rgba(0,0,0,.6), 0 0 0 1px rgba(255,107,53,.2);
}
.routine-link:active{transform:scale(.99)}
.routine-link h3{font-size:clamp(1.08rem, 2vw + 0.3rem, 1.25rem)}
.routine-card-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:var(--space-sm);
  align-items:center;
}
.routine-art{
  width:clamp(4.2rem, 15vw, 5.2rem);
  aspect-ratio:4/3;
  border-radius:0.65rem;
  background:#0d151e;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:none;
}
.routine-art svg{width:100%;height:100%}
@media (min-width:47.5em){
  .routine-group{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .routine-group-head{grid-column:1/-1}
}
@media (min-width:56.25em){
  .routine-groups{grid-template-columns:repeat(2, minmax(0, 1fr));align-items:start}
  .routine-group{grid-template-columns:1fr}
}

/* ============ COMPONENTES Y TARJETAS ============ */
.card{
  background:var(--card);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:var(--space-md);
  display:grid;
  gap:var(--space-sm);
  box-shadow:var(--shadow-card), inset 0 1px 0 var(--glass);
  animation:cardEnter .28s cubic-bezier(.22,1,.36,1) both;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  pointer-events:none;
}
.card.warn{
  border-color:rgba(251,191,36,.35);
  border-left:0.28rem solid var(--warn);
  background:linear-gradient(145deg, #231c12, #17140e);
  box-shadow:0 0.5rem 1.5rem -0.4rem rgba(251,191,36,.12);
}
.card.ok{
  border-color:rgba(45,212,160,.35);
  border-left:0.28rem solid var(--ok);
  background:linear-gradient(145deg, #102620, #0c1c18);
  box-shadow:0 0.5rem 1.5rem -0.4rem rgba(45,212,160,.12);
}
.card.alert{
  border-color:rgba(244,63,94,.35);
  border-left:0.28rem solid var(--danger);
  background:linear-gradient(145deg, #24141a, #190f13);
  box-shadow:0 0.5rem 1.5rem -0.4rem rgba(244,63,94,.12);
}
.note{
  font-size:clamp(0.84rem, 0.8rem + 0.2vw, 0.92rem);
  color:var(--warn);
  background:rgba(251,191,36,.1);
  border:1px solid rgba(251,191,36,.35);
  border-radius:var(--radius-sm);
  padding:0.6rem 0.85rem;
}
.note-safe{
  font-size:clamp(0.82rem, 0.78rem + 0.2vw, 0.9rem);
  color:#d4e2f0;
  background:linear-gradient(90deg, rgba(251,191,36,.09), rgba(16,24,35,.95));
  border:1px solid rgba(251,191,36,.25);
  border-left:0.25rem solid var(--warn);
  border-radius:var(--radius-sm);
  padding:0.75rem 1rem;
  display:flex;
  align-items:center;
  gap:0.75rem;
  box-shadow:0 0.25rem 0.8rem -0.2rem rgba(0,0,0,.3);
}
.ic{
  width:1.25em;
  height:1.25em;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
  transition:transform .15s ease;
}
.ic .f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  min-height:3rem;
  padding:0.5rem 1.1rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--line-bright);
  background:var(--card2);
  font-weight:700;
  text-align:center;
  transition:transform .12s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.btn:hover{border-color:#4d6a88;background:var(--card-hover)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg, #ff6b35 0%, #ff4500 60%, #ff6b35 100%);
  background-size:200% 100%;
  border-color:transparent;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  box-shadow:0 0.4rem 1.2rem -0.2rem rgba(255,70,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .12s ease, box-shadow .2s ease, background-position .3s ease;
}
.btn-primary:hover{
  background-position:100% 0;
  box-shadow:0 0.6rem 1.8rem -0.15rem rgba(255,70,0,.6), inset 0 1px 0 rgba(255,255,255,.2);
  transform:translateY(-1px);
}
.btn-primary:active{
  transform:scale(.98) translateY(0);
  box-shadow:0 0.2rem 0.6rem -0.1rem rgba(255,70,0,.4);
}
.btn-ok{
  background:linear-gradient(135deg, #2dd4a0, #0ea576);
  border-color:transparent;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  box-shadow:0 0.35rem 1rem -0.2rem rgba(45,212,160,.4), inset 0 1px 0 rgba(255,255,255,.15);
}
.btn-ok:hover{
  box-shadow:0 0.5rem 1.4rem -0.15rem rgba(45,212,160,.5);
  transform:translateY(-1px);
}
.btn-ghost{
  background:transparent;
  border-color:var(--glass-border);
  color:var(--muted);
  transition:background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
}
.btn-ghost:hover{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.16);
  color:var(--text);
  transform:translateY(-1px);
}
.btn-ghost:active{
  transform:scale(.98);
}
.btn-danger{
  border-color:rgba(244,63,94,.35);
  color:#ff9db0;
  background:linear-gradient(145deg, #241318, #180d11);
  box-shadow:0 0.2rem 0.6rem -0.1rem rgba(244,63,94,.15);
  transition:background .18s ease, border-color .18s ease, box-shadow .2s ease, transform .12s ease, color .18s ease;
}
.btn-danger:hover{
  background:linear-gradient(145deg, #321620, #220e15);
  border-color:rgba(244,63,94,.65);
  color:#ffe4ea;
  box-shadow:0 0.4rem 1.2rem -0.15rem rgba(244,63,94,.4), 0 0 0 1px rgba(244,63,94,.2);
  transform:translateY(-1px);
}
.btn-danger:active{
  transform:scale(.98);
  box-shadow:0 0.15rem 0.4rem -0.05rem rgba(244,63,94,.25);
}
.btn-xl{
  min-height:clamp(3.4rem, 8vw, 3.9rem);
  font-size:clamp(1rem, 0.95rem + 0.3vw, 1.14rem);
  border-radius:var(--radius);
  width:100%;
}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.icon-btn{
  width:clamp(2.75rem, 6vw, 3rem);
  height:clamp(2.75rem, 6vw, 3rem);
  border-radius:var(--radius-sm);
  border:1px solid var(--line-bright);
  background:var(--card2);
  display:grid;
  place-items:center;
  flex:none;
  transition:border-color .15s ease, background .15s ease, transform .12s ease;
}
.icon-btn:hover{border-color:var(--accent);background:var(--card-hover)}
.icon-btn:active{transform:scale(.94)}
.badge{
  width:clamp(2.5rem, 6vw, 2.85rem);
  height:clamp(2.5rem, 6vw, 2.85rem);
  border-radius:0.85rem;
  background:linear-gradient(135deg, var(--accent) 0%, #ff4500 50%, #ff8854 100%);
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  font-weight:900;
  font-size:clamp(1.05rem, 2.5vw, 1.22rem);
  display:grid;
  place-items:center;
  flex:none;
  box-shadow:0 0.25rem 0.8rem -0.1rem rgba(255,70,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
}
.badge.sm{
  width:clamp(1.9rem, 4.5vw, 2.15rem);
  height:clamp(1.9rem, 4.5vw, 2.15rem);
  border-radius:0.65rem;
  font-size:0.92rem;
  box-shadow:0 0.2rem 0.5rem -0.05rem rgba(255,70,0,.3);
}
.badge-tag{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  padding:0.22rem 0.58rem;
  border-radius:0.5rem;
  font-size:clamp(0.68rem, 0.65rem + 0.15vw, 0.74rem);
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.badge-tag.abs{background:#2d1c13;color:#ff8b5e;border:1px solid #63331d}
.badge-tag.chest{background:#12293b;color:var(--info);border:1px solid #204b6b}
.badge-tag.warm{background:#2f2410;color:var(--warn);border:1px solid #5c4517}
.equipment-note{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  width:fit-content;
  margin-top:.25rem;
  padding:.25rem .65rem;
  border:1px solid rgba(56,189,248,.25);
  border-radius:99rem;
  background:linear-gradient(90deg, rgba(56,189,248,.08), rgba(27,37,49,.8));
  color:#b0cce6;
  font-size:.78rem;
  font-weight:600;
}
.equipment-note b{color:var(--text);font-weight:700}
.badge-side{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  padding:0.38rem 0.75rem;
  border-radius:0.6rem;
  font-weight:800;
  font-size:0.8rem;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.badge-side.left{background:#112a3d;color:#38bdf8;border:1px solid #0369a1}
.badge-side.right{background:#32193b;color:#e879f9;border:1px solid #a21caf}
.bar{
  height:0.8rem;
  border-radius:99rem;
  background:linear-gradient(180deg, #0e141c, #16202c);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45);
  overflow:hidden;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg, #ff6b35, #ff4500, #fbbf24, #ff6b35);
  background-size:300% 100%;
  border-radius:99rem;
  transition:width .45s cubic-bezier(.22,1,.36,1);
  animation:shimmerBar 3s linear infinite;
}
.clock{
  font-family:var(--font-mono), var(--font);
  font-size:clamp(3rem, 14vw, 5rem);
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  line-height:1;
  background:linear-gradient(135deg, var(--text) 0%, rgba(234,240,247,.6) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hint{font-size:clamp(0.78rem, 0.75rem + 0.18vw, 0.86rem);color:var(--muted)}
.err{color:#ff9db0;font-size:0.88rem;font-weight:600}
.lbl{font-weight:700;font-size:0.92rem}

/* ============ HERO Y LISTAS DE EJERCICIOS ============ */
.hero{
  background:linear-gradient(135deg, #1d2836 0%, #141c25 62%, #19181c 100%);
  border-color:var(--line-bright);
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;
  top:-40%;
  right:-15%;
  width:55%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,107,53,.06) 0%, transparent 70%);
  pointer-events:none;
}
.hero.abs-theme{background:linear-gradient(135deg, #271e1a 0%, #141c25 65%)}
.hero-banner-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--space-md);
  align-items:center;
}
@media (min-width:42em){
  .hero-banner-grid{grid-template-columns:1.35fr 0.85fr}
}
.hero-visual{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:0.5rem;
  background:rgba(10,14,19,.55);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:0.6rem;
}
.hero-visual-item{
  background:linear-gradient(145deg, var(--card2), #141d27);
  border:1px solid var(--glass-border);
  border-radius:0.7rem;
  padding:0.45rem;
  display:grid;
  place-items:center;
  text-align:center;
  gap:0.25rem;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.hero-visual-item:hover{
  transform:translateY(-2px);
  border-color:rgba(255,107,53,.4);
  box-shadow:0 0.35rem 1rem -0.2rem rgba(255,107,53,.2);
}
.hero-visual-item svg{width:100%;max-width:4.2rem;height:auto}
.hero-visual-item span{font-size:0.7rem;font-weight:700;color:var(--text)}
.meta-pills{display:flex;gap:0.4rem;flex-wrap:wrap;margin:0.2rem 0}
.pill{
  background:rgba(27,37,49,.6);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(4px);
  border-radius:99rem;
  padding:0.32rem 0.75rem;
  font-size:clamp(0.74rem, 0.7rem + 0.15vw, 0.8rem);
  font-weight:700;
  color:var(--muted);
  display:inline-flex;
  align-items:center;
  gap:0.35rem;
}
.pill b{color:var(--text)}
.list{display:grid;gap:0.6rem}
.list li{
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  padding:0.7rem 0.8rem;
  border-radius:var(--radius-sm);
  background:var(--card2);
  border:1px solid var(--line);
  transition:border-color .15s ease, background .15s ease;
}
.list li:hover{border-color:var(--line-bright)}
.list li .t{flex:1;min-width:0}
.list li .t b{display:block;line-height:1.25}
.list li .t span{color:var(--muted);font-size:clamp(0.8rem, 0.76rem + 0.18vw, 0.88rem)}
.list-thumb{
  width:clamp(4rem, 15vw, 4.8rem);
  aspect-ratio:4/3;
  border-radius:0.6rem;
  background:#0d151e;
  border:1px solid var(--line-bright);
  display:grid;
  place-items:center;
  flex:none;
  overflow:hidden;
}
.list-thumb svg{width:100%;height:100%}
.steps li.done{
  border-color:rgba(45,212,160,.3);
  background:linear-gradient(90deg, rgba(45,212,160,.08), rgba(27,37,49,.6));
}
.steps li.done .badge{
  background:linear-gradient(135deg, var(--ok), #10b981);
  color:#04201a;
  box-shadow:0 0 10px rgba(45,212,160,.3);
}
.steps li.cur{
  border-color:var(--accent);
  border-left:0.25rem solid var(--accent);
  background:linear-gradient(90deg, rgba(255,107,53,.15), rgba(27,37,49,.9));
  box-shadow:0 0.25rem 0.9rem -0.2rem rgba(255,107,53,.35);
}
.steps li.cur .badge{
  background:linear-gradient(135deg, var(--accent), #ff4500);
  box-shadow:0 0 12px rgba(255,107,53,.45);
}
.steps li.pend{opacity:.68}

/* ============ TARJETA DE EJERCICIO ACTIVO E ILUSTRACIONES SVG ============ */
.ex-head{display:flex;align-items:center;gap:var(--space-sm)}
.ex-head .grow{min-width:0}
.facts{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 5.8rem), 1fr));
  gap:0.5rem;
}
.facts div{
  background:linear-gradient(160deg, var(--card2), #131c27);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  padding:0.6rem 0.75rem;
  display:grid;
  gap:0.18rem;
  position:relative;
  overflow:hidden;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.facts div::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, var(--accent), transparent 70%);
  opacity:.45;
  pointer-events:none;
}
.facts div:first-child::before{ opacity:.7; }
.facts span{
  font-size:clamp(0.63rem, 0.6rem + 0.12vw, 0.69rem);
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--muted);
  font-weight:800;
}
.facts b{
  font-size:clamp(1rem, 0.95rem + 0.28vw, 1.15rem);
  font-weight:900;
  color:var(--text);
}
.sets{display:flex;gap:0.5rem;flex-wrap:wrap}
.setchip{
  min-width:clamp(3.4rem, 11vw, 3.8rem);
  min-height:clamp(3.5rem, 11vw, 3.9rem);
  border-radius:var(--radius-sm);
  border:2px solid var(--line-bright);
  background:var(--card2);
  display:grid;
  place-items:center;
  align-content:center;
  gap:0.1rem;
  padding:0.25rem 0.5rem;
  line-height:1.1;
  font-weight:800;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.setchip:hover{border-color:#537394}
.setchip:active{transform:scale(.95)}
.setchip .n{font-weight:800;font-size:0.95rem}
.setchip .r{font-size:0.76rem;color:var(--muted)}
.setchip.done{
  background:linear-gradient(135deg, #0d2e24, #133a2f);
  border-color:var(--ok);
  box-shadow:0 0 0 1px rgba(45,212,160,.25), 0 0.25rem 0.6rem -0.1rem rgba(45,212,160,.2), inset 0 1px 0 rgba(255,255,255,.08);
}
.setchip.done .n{color:var(--ok)}
.setchip.done .r{color:var(--ok);font-weight:800}
.setchip.skipped{border-style:dashed;opacity:.75}
.setchip.cur{
  box-shadow:0 0 0 0.22rem rgba(255,107,53,.35), 0 0 1rem rgba(255,107,53,.15);
  border-color:var(--accent);
  background:linear-gradient(135deg, #261d18, #1e1510);
}
.tech{
  display:grid;
  grid-template-columns:1fr;
  gap:var(--space-sm);
  align-items:center;
  background:var(--card2);
  border:1px solid var(--line-bright);
  border-radius:var(--radius-sm);
  padding:var(--space-sm);
}
@media (min-width:30em){
  .tech{grid-template-columns:minmax(7.5rem, 34%) 1fr}
}
.tech svg{
  width:100%;
  max-width:12rem;
  margin:0 auto;
  height:auto;
  aspect-ratio:16/10;
  border-radius:0.6rem;
  background:radial-gradient(circle at 50% 35%, #162433, #0c131b);
  border:1px solid var(--line);
  display:block;
}
.tech p+p{margin-top:0.45rem}

/* Clases vectoriales anatómicas y mecánicas */
.hd-grid{stroke:rgba(147,163,184,.08);stroke-width:1}
.hd-mat{fill:#192838;stroke:#2d455e;stroke-width:1.5}
.hd-machine{fill:#1f2f40;stroke:#3e5873;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd-cable{stroke:#637d99;stroke-width:1.6;stroke-dasharray:2 2;fill:none}
.hd-body{fill:#486482}
.hd-head{fill:#5d7d9e;stroke:#253545;stroke-width:1.2}
.hd-torso{stroke:#587898;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hd-limb{fill:none;stroke:#8ba6c4;stroke-linecap:round;stroke-linejoin:round}
.hd-joint{fill:#b8cce0}
.hd-hand{fill:var(--accent)}
.hd-block{fill:#3b5169;stroke:#526e8c;stroke-width:1.2}
.hd-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;animation:flowDash 1.8s linear infinite}
.hd-arrow{stroke:var(--ok);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hd-core{
  fill:rgba(255,107,53,.38);
  stroke:var(--accent);
  stroke-width:1.8;
  transform-box:fill-box;
  transform-origin:center;
  animation:corePulse 2.6s ease-in-out infinite;
}
.hd-float{animation:floatSubtle 2.8s ease-in-out infinite}
.hd-txt{fill:var(--text);font:700 10.5px var(--font);letter-spacing:.01em}
.hd-subtxt{fill:var(--muted);font:600 9px var(--font)}

/* ============ TEMPORIZADOR Y CONTROLES DE SERIE ============ */
.timer-block{
  background:linear-gradient(180deg, #0a1118, #0d1620);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--radius-sm);
  padding:var(--space-md);
  text-align:center;
  display:grid;
  gap:var(--space-sm);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.timer-state{
  font-weight:700;
  color:var(--muted);
  font-size:0.9rem;
  display:inline-flex;
  align-items:center;
  gap:0.45rem;
}
.timer-state.running{
  color:var(--ok);
  font-weight:800;
}
.timer-state.running::before{
  content:'';
  width:0.5rem;
  height:0.5rem;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 0 rgba(45,212,160,.8);
  animation:pulseRunningDot 1.4s infinite ease-out;
  flex:none;
  display:inline-block;
}
.timer-state.paused{
  color:var(--warn);
  font-weight:800;
}
.timer-state.paused::before{
  content:'';
  width:0.5rem;
  height:0.5rem;
  border-radius:50%;
  background:var(--warn);
  flex:none;
  display:inline-block;
}
@keyframes pulseRunningDot{
  0%{box-shadow:0 0 0 0 rgba(45,212,160,.8);transform:scale(0.95)}
  70%{box-shadow:0 0 0 7px rgba(45,212,160,0);transform:scale(1.1)}
  100%{box-shadow:0 0 0 0 rgba(45,212,160,0);transform:scale(0.95)}
}
.editor{display:grid;gap:var(--space-sm);border-top:1px dashed var(--line-bright);padding-top:var(--space-sm)}
.stepper{
  display:grid;
  grid-template-columns:clamp(3.4rem, 14vw, 4.2rem) 1fr clamp(3.4rem, 14vw, 4.2rem);
  gap:var(--space-sm);
  align-items:stretch;
}
.stepper .btn{min-height:clamp(3.4rem, 10vw, 3.85rem);font-size:1.5rem;padding:0}
.stepper input{
  width:100%;
  min-height:clamp(3.4rem, 10vw, 3.85rem);
  text-align:center;
  font-size:clamp(1.6rem, 5vw, 2.05rem);
  font-weight:800;
  border-radius:var(--radius-sm);
  border:2px solid var(--line-bright);
  background:#0d141c;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.stepper input:focus{border-color:var(--accent);outline:none}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rpe{display:grid;grid-template-columns:repeat(5, 1fr);gap:0.38rem}
@media (min-width:28.75em){.rpe{grid-template-columns:repeat(10, 1fr)}}
.rpe-chip{
  min-height:2.85rem;
  border-radius:0.65rem;
  border:1px solid var(--line-bright);
  background:var(--card2);
  font-weight:800;
  transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.rpe-chip:hover{border-color:var(--accent);background:var(--card-hover)}
.rpe-chip.on{
  background:linear-gradient(135deg, var(--accent) 0%, #ff4500 100%);
  border-color:var(--accent);
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 0.35rem 1rem -0.15rem rgba(255,107,53,.55), inset 0 1px 0 rgba(255,255,255,.2);
}
.actions{display:grid;gap:var(--space-sm)}
.actions .pair{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr));gap:var(--space-sm)}
.tempo{
  display:grid;
  gap:var(--space-xs);
  border:1px solid rgba(255,107,53,.3);
  border-left:0.3rem solid var(--accent);
  background:linear-gradient(135deg, rgba(255,107,53,.08) 0%, rgba(13,20,28,.85) 100%);
  border-radius:var(--radius-sm);
  padding:var(--space-md);
  text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0.4rem 1.2rem -0.3rem rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
}
.tempo::before{
  content:'';
  position:absolute;
  top:0;right:0;width:5rem;height:5rem;
  background:radial-gradient(circle, rgba(255,107,53,.15) 0%, transparent 70%);
  pointer-events:none;
}
.tempo-phase{
  font-size:1.1rem;
  font-weight:900;
  letter-spacing:.16em;
  color:var(--accent);
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.4rem;
}
.tempo-count{
  font-family:var(--font-mono), var(--font);
  font-size:clamp(2.8rem, 11vw, 3.8rem);
  font-weight:900;
  line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg, #fff 0%, rgba(255,255,255,.75) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:#fff;
  text-shadow:0 0 1.5rem rgba(255,107,53,.4);
}

/* ============ DESCANSO ============ */
.ring-wrap{
  position:relative;
  width:clamp(11.5rem, 58vw, 15.5rem);
  aspect-ratio:1;
  margin:0.35rem auto;
}
.ring{width:100%;height:100%}
.ring-bg{fill:none;stroke:#202e3d;stroke-width:9}
.ring-fg{
  fill:none;
  stroke:url(#ringGrad);
  stroke-width:9;
  stroke-linecap:round;
  transition:stroke-dashoffset .3s linear;
  filter:drop-shadow(0 0 6px rgba(255,107,53,.4));
}
.paused .ring-fg{stroke:var(--warn);filter:drop-shadow(0 0 6px rgba(251,191,36,.4))}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:0.35rem;padding:1rem}
.rest-btns{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:var(--space-xs)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);flex-wrap:wrap}
.mini .ctl{display:flex;align-items:center;gap:0.5rem}
.mini .ctl b{min-width:3.5rem;text-align:center;font-variant-numeric:tabular-nums}
.mini .btn{min-height:2.6rem;padding:0 0.75rem}

/* ============ LAYOUT DE ENTRENAMIENTO ============ */
.work{display:grid;gap:var(--space-md)}
.col-main,.col-side{display:grid;gap:var(--space-md);align-content:start;min-width:0}
@media (min-width:56.25em){
  .work{grid-template-columns:minmax(0, 1.55fr) minmax(18rem, 1fr);align-items:start}
  .col-side{position:sticky;top:5.2rem}
}
.ov-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:0.6rem;
  text-align:left;
  padding:0.55rem 0.75rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:var(--card2);
  position:relative;
  transition:border-color .18s ease, background .18s ease, transform .12s ease, box-shadow .18s ease;
}
.ov-item:hover:not([disabled]){border-color:var(--line-bright);background:var(--card-hover);transform:translateX(2px)}
.ov-item.cur{
  border-color:rgba(255,107,53,.6);
  border-left:0.25rem solid var(--accent);
  background:linear-gradient(90deg, rgba(255,107,53,.16), rgba(27,37,49,.9));
  box-shadow:0 0.25rem 0.8rem -0.2rem rgba(255,107,53,.3);
}
.ov-item[disabled]{opacity:1;cursor:default}
.ov-name{flex:1;font-weight:700;min-width:0;font-size:0.9rem}
.dots{display:flex;gap:0.25rem;flex-wrap:wrap}
.dot{width:0.6rem;height:0.6rem;border-radius:50%;background:#2c3b4b}
.dot.done{background:var(--ok)}
.dot.skipped{background:transparent;border:2px solid var(--warn)}
details.card>summary{
  cursor:pointer;
  font-weight:800;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:2.4rem;
  padding:0.2rem 0.4rem;
  border-radius:var(--radius-sm);
  transition:background .15s ease, color .15s ease;
}
details.card>summary:hover{
  background:rgba(255,255,255,.03);
  color:var(--text);
}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{
  content:'';
  width:0.55rem;
  height:0.55rem;
  border-right:2.5px solid var(--accent);
  border-bottom:2.5px solid var(--accent);
  transform:rotate(45deg);
  transition:transform .25s var(--transition-spring);
  margin-right:0.4rem;
  flex:none;
}
details.card[open]>summary::after{
  transform:rotate(-135deg);
}
details.card[open]>summary{margin-bottom:var(--space-sm)}

/* ============ RESUMEN, ESTADÍSTICAS Y TABLAS ============ */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 8.2rem), 1fr));
  gap:var(--space-sm);
}
.stat{
  background:linear-gradient(145deg, var(--card2), #151e29);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  padding:0.85rem 0.75rem;
  display:grid;
  gap:0.2rem;
  position:relative;
  overflow:hidden;
}
.stat::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, var(--accent), transparent);
  opacity:.5;
}
.stat span{

  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--muted);
  font-weight:700;
}

  font-size:clamp(1.3rem, 3.5vw, 1.65rem);
  font-variant-numeric:tabular-nums;
  color:var(--text);

  background-clip:text;

.tbl th,.tbl td{text-align:left;padding:0.6rem 0.5rem;border-bottom:1px solid var(--glass-border)}

.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}

.pos{color:var(--ok);font-weight:800}

.neu{color:var(--muted);font-weight:700}

.bt-v{fill:var(--text);font:800 12px var(--font)}
.bt-l{fill:var(--muted);font:600 11px var(--font)}
.axis{stroke:rgba(255,255,255,.12);stroke-width:1}

  font:inherit;
  width:100%;
  appearance:none;
  -webkit-appearance:none;
  cursor:pointer;
  transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;

select:hover{
  border-color:rgba(255,255,255,.18);
  background-color:#111a24;
}
select:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,107,53,.25);
}
.hist{padding:0}
details.hist{
  background:linear-gradient(160deg, var(--card) 0%, #10161f 100%);

  border-radius:var(--radius-sm);
  overflow:hidden;
  transition:border-color .2s ease, box-shadow .2s ease;
}
details.hist:hover{
  border-color:rgba(255,255,255,.14);
  box-shadow:0 0.35rem 1.2rem -0.2rem rgba(0,0,0,.35);
}
details.hist[open]{
  border-color:rgba(255,107,53,.35);
  box-shadow:0 0.45rem 1.6rem -0.25rem rgba(0,0,0,.5);
}
details.hist>summary{
  list-style:none;
  cursor:pointer;
  padding:0.85rem 1rem;
  display:grid;
  gap:0.3rem;
  min-height:3.2rem;
  position:relative;
  transition:background .18s ease;
}
details.hist>summary:hover{
  background:rgba(255,255,255,.03);
}
details.hist>summary::-webkit-details-marker{display:none}
details.hist>summary::after{
  content:'';
  position:absolute;
  right:1rem;
  top:50%;
  width:0.5rem;
  height:0.5rem;
  border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);
  transform:translateY(-60%) rotate(45deg);
  transition:transform .2s ease, border-color .2s ease;
}
details.hist[open]>summary::after{
  transform:translateY(-40%) rotate(-135deg);
  border-color:var(--accent);
}
details.hist[open]>summary{
  border-bottom:1px solid var(--glass-border);
  background:rgba(255,107,53,.04);
}
.h-date{font-weight:800;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.h-meta{color:var(--muted);font-size:0.88rem}
.h-body{padding:0.9rem 1rem;display:grid;gap:var(--space-sm);background:rgba(10,14,19,.4)}

  gap:var(--space-sm);
  padding:0.5rem 0;
  min-height:3.4rem;
}
.sw-t{display:grid;gap:0.15rem}
.sw-t small{color:var(--muted);font-size:0.83rem}
.sw input{

  -webkit-appearance:none;
  width:3.35rem;
  height:2rem;
  border-radius:99rem;
  background:#1e2936;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.4);
  position:relative;
  flex:none;
  cursor:pointer;
  transition:background .2s cubic-bezier(.22,1,.36,1), border-color .2s ease, box-shadow .2s ease;
  margin:0;

  content:"";
  position:absolute;
  top:0.2rem;
  left:0.2rem;
  width:1.5rem;
  height:1.5rem;
  border-radius:50%;
  background:linear-gradient(180deg, #ffffff, #d9e2ec);
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:transform .25s cubic-bezier(.22,1,.36,1);

  background:linear-gradient(135deg, var(--ok), #059669);
  border-color:transparent;
  box-shadow:0 0 12px rgba(45,212,160,.35), inset 0 1px 0 rgba(255,255,255,.2);
}
.sw input:checked::after{
  transform:translateX(1.35rem);
}
.sw input:hover:not(:disabled){
  border-color:rgba(255,255,255,.2);
}
.sw input:disabled{opacity:.4;cursor:not-allowed}
.cfg-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 7.2rem), 1fr));

}
.fld{display:grid;gap:0.28rem;font-size:0.82rem;font-weight:700;color:var(--muted)}

  width:100%;

  line-height:1.2;
}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:0.45rem 0.9rem;align-items:center}

.backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,6,10,.76);
  backdrop-filter:blur(4px);
  display:grid;
  align-items:end;
  justify-items:center;
  padding:0;
}
@media (min-width:37.5em){.backdrop{align-items:center;padding:1rem}}
.dialog{
  width:100%;
  max-width:32.5rem;
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line-bright);
  border-radius:1.35rem 1.35rem 0 0;
  padding:1.25rem 1.15rem calc(1.15rem + var(--safe-b));
  display:grid;
  gap:var(--space-md);
  box-shadow:0 1.2rem 3rem rgba(0,0,0,.65);
}

.dlg-actions{display:grid;gap:var(--space-sm)}
.dlg-actions.n2{grid-template-columns:repeat(auto-fit, minmax(min(100%, 8rem), 1fr))}
#toast{
  position:fixed;
  left:50%;
  bottom:calc(5.5rem + var(--safe-b));
  transform:translate(-50%, 1.25rem);
  z-index:120;
  background:#f4f7fb;
  color:#0a0e13;
  padding:0.75rem 1.15rem;
  border-radius:var(--radius-sm);
  font-weight:700;
  max-width:min(92vw, 28rem);
  text-align:center;
  opacity:0;
  pointer-events:none;
  box-shadow:0 0.6rem 1.8rem rgba(0,0,0,.45);
  transition:opacity .25s ease, transform .25s cubic-bezier(.22,1,.36,1);
}
#toast.show{opacity:1;transform:translate(-50%, 0)}
@media (min-width:43.75em){#toast{bottom:1.75rem}}

/* ============ SCROLLBAR PERSONALIZADA ============ */
::-webkit-scrollbar{
  width:8px;
  height:8px;
}
::-webkit-scrollbar-track{
  background:rgba(10,14,19,.7);
}
::-webkit-scrollbar-thumb{
  background:#263647;
  border-radius:99rem;
  border:2px solid rgba(10,14,19,.7);
}
::-webkit-scrollbar-thumb:hover{
  background:#3b536e;
}
*{
  scrollbar-width:thin;
  scrollbar-color:#263647 rgba(10,14,19,.7);
}

/* Respeto estricto a prefers-reduced-motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important;
  }
}

@keyframes pulseRing{
  0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}
  50%{box-shadow:0 0 0 8px rgba(255,107,53,.0)}
}
@keyframes slideUpFade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.card{animation:slideUpFade .3s cubic-bezier(.22,1,.36,1) both}

#toast{
  border-radius:var(--radius-sm);
  backdrop-filter:blur(10px);
  background:rgba(244,247,251,.95);
  box-shadow:0 0.8rem 2.4rem rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1);
  font-size:0.9rem;
}

function normalizeEx(d,o){
  const sets=clamp(toInt(o.sets,d.sets),1,10);
  const rest=clamp(toInt(o.rest,d.rest),0,600);
  if(d.type==='time'||d.type==='time_sides'){

    return {sets,duration,rest};

  const repMin=clamp(toInt(o.repMin,d.repMin),1,100);
  const repMax=Math.max(repMin,clamp(toInt(o.repMax,d.repMax),1,100));
  return {sets,repMin,repMax,rest};
}

function cleanEntry(x){
  const o=x&&typeof x==='object'?x:{};
  const st=['pending','done','skipped'].includes(o.status)?o.status:'pending';
  if(st==='done'){
    const n=(o.reps===null||o.reps===undefined)?NaN:Number(o.reps);
    if(!Number.isFinite(n)||n<1) return {status:'pending',reps:null,rpe:null,sub:false};
    let rpe=null; if(o.rpe!==null&&o.rpe!==undefined){ const r=Number(o.rpe); if(Number.isFinite(r)&&r>=1&&r<=10) rpe=Math.round(r); }
    return {status:'done',reps:clamp(Math.round(n),1,999),rpe,sub:!!o.sub};
  }
  return {status:st,reps:null,rpe:null,sub:!!o.sub};
}

function totalsOf(list){
  let setsDone=0, setsSkipped=0, setsPlanned=0, reps=0, timeSec=0, exDone=0, rpeSum=0, rpeN=0;
  list.forEach(x=>{
    let all=x.sets.length>0;
    x.sets.forEach(st=>{
      setsPlanned++;
      if(st.status==='done'){
        setsDone++;
        if(x.type==='time'||x.type==='time_sides'){
          timeSec += st.reps || x.duration || 0;
        } else {
          reps += st.reps || 0;
        }
        if(st.rpe){ rpeSum+=st.rpe; rpeN++; }
      } else {
        all=false;
        if(st.status==='skipped') setsSkipped++;
      }
    });
    if(all) exDone++;
  });
  return {
    setsDone, setsSkipped, setsPlanned, reps, timeSec,
    exercisesDone: exDone,
    exercisesTotal: list.length,
    avgRpe: rpeN ? round1(rpeSum/rpeN) : null
  };
}

function sanitizeRecord(r){

    if(!Array.isArray(r.exercises)||!r.exercises.length||r.exercises.length>25) return null;
    const routineId = ROUTINE_DEFS[r.routineId] ? r.routineId : 'chest';
    const routineName = String(r.routineName || ALL_ROUTINES[routineId].name).slice(0,60);
    const exercises=r.exercises.map(x=>{
      if(!x||typeof x!=='object') return null;
      const sets=(Array.isArray(x.sets)?x.sets.slice(0,30):[]).map(cleanEntry);
      return {
        id: String(x.id||'ex').slice(0,30),
        name: String(x.name||'Ejercicio').slice(0,90),
        type: x.type || 'reps',
        sub: !!x.sub,
        repMin: toInt(x.repMin,1),
        repMax: toInt(x.repMax,1),
        duration: toInt(x.duration,0),
        rest: clamp(toInt(x.rest,0),0,600),
        sets
      };
    }).filter(Boolean);
    if(!exercises.length) return null;
    const endedAt=Number.isFinite(Number(r.endedAt))?Number(r.endedAt):startedAt;
    return {
      id: String(r.id||uid()).slice(0,60),
      routineId,
      routineName,
      startedAt,
      endedAt,
      durationSec: clamp(Math.round(Number(r.durationSec)||0),0,172800),
      warmup: !!r.warmup,
      early: !!r.early,
      exercises,
      totals: totalsOf(exercises)
    };
  }catch(e){ return null; }
}

function sortHistory(){ history.sort((a,b)=>b.startedAt-a.startedAt); }

function reconcile(s){
  if(!s) return;
  const rot = routineFor(s.routineId);
  rot.forEach((e,i)=>{
    const l=s.logs[i];
    if(!l) return;
    while(l.length<e.sets) l.push({status:'pending',reps:null,rpe:null,sub:false});
    while(l.length>e.sets && l[l.length-1].status==='pending') l.pop();
  });
  s.cur.ex=clamp(s.cur.ex, 0, rot.length-1);
  s.cur.set=clamp(s.cur.set, 0, Math.max(0, s.logs[s.cur.ex].length-1));
}

function sanitizeSession(raw){
  try{
    if(!raw||typeof raw!=='object') return null;
    if(!['warmup','work','summary'].includes(raw.phase)) return null;
    if(raw.phase==='summary' && raw.saved) return null;
    const routineId = ROUTINE_DEFS[raw.routineId] ? raw.routineId : 'chest';
    const defRot = ROUTINE_DEFS[routineId];
    if(!Array.isArray(raw.logs)||raw.logs.length!==defRot.length) return null;
    const now=Date.now(), w=raw.warm&&typeof raw.warm==='object'?raw.warm:{};
    const s={
      id: String(raw.id||uid()).slice(0,60),
      routineId,
      routineName: ALL_ROUTINES[routineId].name,
      startedAt: numOr(raw.startedAt,now),
      activeMs: Math.max(0,numOr(raw.activeMs,0)),
      lastTouch: numOr(raw.lastTouch,now),
      phase: raw.phase,
      warm: {ms:Math.max(0,numOr(w.ms,0)),since:Number.isFinite(w.since)?w.since:null,done:!!w.done,used:!!w.used},
      logs: raw.logs.map(l=>Array.isArray(l)?l.slice(0,10).map(cleanEntry):[]),
      cur: {ex:clamp(toInt(raw.cur&&raw.cur.ex,0),0,defRot.length-1),set:Math.max(0,toInt(raw.cur&&raw.cur.set,0))},
      rest: null,
      workTimer: null,
      draft: null,
      early: !!raw.early,
      saved: !!raw.saved,
      endedAt: Number.isFinite(raw.endedAt)?raw.endedAt:null
    };
    reconcile(s);
    const r=raw.rest;
    if(r&&Number.isFinite(r.endAt)){
      const ex=toInt(r.ex,-1), st=toInt(r.set,-1);
      if(s.logs[ex]&&s.logs[ex][st]) s.rest={endAt:r.endAt,total:Math.max(1000,numOr(r.total,1000)),paused:!!r.paused,remaining:Math.max(0,numOr(r.remaining,0)),ex,set:st};
    }
    const wt=raw.workTimer;
    if(wt&&Number.isFinite(wt.total)){
      s.workTimer = {
        endAt: wt.endAt,
        total: Math.max(1000,numOr(wt.total,1000)),
        paused: !!wt.paused,
        remaining: Math.max(0,numOr(wt.remaining,0)),
        running: !!wt.running,
        lastBeep: wt.lastBeep || 0
      };
    }
    const d=raw.draft;
    if(d&&typeof d==='object'&&s.logs[toInt(d.ex,-1)]&&s.logs[d.ex][toInt(d.set,-1)]){
      s.draft={ex:d.ex,set:d.set,reps:(typeof d.reps==='number'||typeof d.reps==='string')?d.reps:'',rpe:Number.isFinite(d.rpe)?clamp(Math.round(d.rpe),1,10):null};
    }
    return s;
  }catch(e){ return null; }
}

function firstPending(s){ for(let i=0;i<s.logs.length;i++){ const j=s.logs[i].findIndex(x=>x.status==='pending'); if(j>=0) return {ex:i,set:j}; } return null; }
function findNext(s,ex,set){
  const flat=[]; s.logs.forEach((l,i)=>l.forEach((e,j)=>flat.push({ex:i,set:j,st:e.status})));
  const idx=flat.findIndex(f=>f.ex===ex&&f.set===set);
  for(let k=1;k<flat.length;k++){ const f=flat[(idx+k)%flat.length]; if(f.st==='pending') return {ex:f.ex,set:f.set}; }
  return null;
}

function touch(){

function getDraft(){
  const s=session, rot=activeRoutine(), {ex,set}=s.cur, entry=s.logs[ex][set];
  if(!s.draft||s.draft.ex!==ex||s.draft.set!==set){
    let reps, rpe=null;
    if(entry.status==='done'){
      reps=entry.reps; rpe=entry.rpe;
    } else {
      const prev=[...s.logs[ex]].reverse().find(x=>x.status==='done'&&x.reps!=null);
      if(prev){
        reps=prev.reps;
      } else {
        const item=rot[ex];
        reps = item.defaultReps || (item.repMin ? Math.round((item.repMin+item.repMax)/2) : 10);
      }
    }
    s.draft={ex,set,reps,rpe};
  }
  return s.draft;
}

let audioCtx=null;
function ensureAudio(){
  try{
    if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); }
    if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(freq,dur,when,vol){
  try{
    if(!audioCtx) return;
    const t=audioCtx.currentTime+(when||0), o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function vibrate(p){ if(settings.vibrate&&navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
function alertEnd(){
  if(settings.sound){ ensureAudio(); beep(880,.16,0); beep(880,.16,.24); beep(1175,.32,.48); }
  vibrate([220,110,220]);
}

let wakeSentinel=null, wakeBusy=false;
async function updateWake(){
  if(wakeBusy||!('wakeLock' in navigator)) return;
  wakeBusy=true;
  try{
    const want=settings.wake&&session&&session.phase!=='summary'&&document.visibilityState==='visible';
    if(want&&!wakeSentinel){ wakeSentinel=await navigator.wakeLock.request('screen'); wakeSentinel.addEventListener('release',()=>{ wakeSentinel=null; }); }
    else if(!want&&wakeSentinel){ await wakeSentinel.release(); wakeSentinel=null; }
  }catch(e){ wakeSentinel=null; }
  wakeBusy=false;
}
function toast(msg){
  const t=$('#toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(ui.toastT); ui.toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
function announce(msg){ const l=$('#live'); if(!l) return; l.textContent=''; setTimeout(()=>{ l.textContent=msg; },60); }

let dlg=null;
function showDialog(o){
  return new Promise(resolve=>{
    if(dlg) closeDialog(dlg.dismiss);
    const btns=(o.buttons||[]).map(b=>`<button class="btn ${b.cls||''}" data-dlg="${esc(b.value)}" ${b.auto?'data-autofocus':''}>${b.label}</button>`).join('');
    $('#modalRoot').innerHTML=`<div class="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><h2 id="dlgTitle">${esc(o.title)}</h2><div class="stack">${o.html||''}</div><div class="dlg-actions ${(o.buttons||[]).length===2?'n2':''}">${btns}</div></div></div>`;
    dlg={resolve,prev:document.activeElement,dismiss:o.dismiss===undefined?null:o.dismiss,onClose:o.onClose};
    $$('.topbar,#app').forEach(el=>{ el.inert=true; });
    const first=$('[data-autofocus]')||$('.dialog input,.dialog select')||$('.dialog button');

function closeDialog(value){
  if(!dlg) return;

  $$('.topbar,#app').forEach(el=>{ el.inert=false; });
  if(d.prev&&document.contains(d.prev)&&d.prev.focus) d.prev.focus();
  d.resolve(value);
  if(d.onClose) d.onClose();
}
function ask(o){
  return showDialog({title:o.title,html:`<p>${esc(o.message)}</p>`,dismiss:'no',
    buttons:[{label:esc(o.cancel||'Cancelar'),value:'no',auto:true},{label:esc(o.confirm||'Aceptar'),value:'yes',cls:o.danger?'btn-danger':'btn-primary'}]}).then(v=>v==='yes');
}

/* =====================================================================
   8. TEMPORIZADORES (TICKER CENTRAL)
   ===================================================================== */
let tickHandle=null;
function startTicker(){ if(tickHandle) clearInterval(tickHandle); tickHandle=setInterval(tick,250); }

function warmSteps(){ return (settings.cuff || (session&&session.routineId==='caf-chest'))?WARMUP_CUFF:WARMUP_BASE; }
function warmTotalMs(){ return warmSteps().reduce((a,x)=>a+x.sec,0)*1000; }
function warmElapsed(now){ const w=session.warm; return Math.min(warmTotalMs(),w.ms+(w.since?(now||Date.now())-w.since:0)); }
function warmStepIndex(el){ let acc=0; const st=warmSteps(); for(let i=0;i<st.length;i++){ acc+=st[i].sec*1000; if(el<acc) return i; } return st.length; }

function restLeft(now){ const r=session.rest; if(!r) return 0; return r.paused?r.remaining:Math.max(0,r.endAt-(now||Date.now())); }
function startRest(sec,last){
  const now=Date.now();
  session.rest={endAt:now+sec*1000,total:sec*1000,paused:false,remaining:sec*1000,ex:last.ex,set:last.set};
  stopTempo();
  session.workTimer=null;
}
function restAdjust(delta){
  const r=session&&session.rest; if(!r) return;
  if(r.paused) r.remaining=Math.max(0,r.remaining+delta); else r.endAt=Math.max(Date.now(),r.endAt+delta);
  r.total=Math.max(1000,r.total+delta);
  const left=restLeft(); r.total=Math.max(r.total,left);
  if(left<=0){ endRest('skip'); return; }
  saveSession(); render();
}
function restPause(){
  const r=session&&session.rest; if(!r) return;
  if(r.paused){ r.endAt=Date.now()+r.remaining; r.paused=false; }
  else { r.remaining=Math.max(0,r.endAt-Date.now()); r.paused=true; }
  saveSession(); render();
}
function endRest(mode){
  if(!session||!session.rest) return;
  session.rest=null;
  if(mode==='alert'){ alertEnd(); toast('¡Descanso terminado! Siguiente serie'); announce('Descanso terminado'); }
  else if(mode==='late'){ toast('El descanso ya terminó'); announce('El descanso ya terminó'); }
  saveSession(); render();
}

function currentWorkDuration(){
  if(!session) return 30;
  const rot=activeRoutine(), e=rot[session.cur.ex];
  return e.duration || 30;
}
function workLeft(now){
  const wt=session&&session.workTimer;
  if(!wt) return currentWorkDuration() * 1000;
  return wt.paused ? wt.remaining : Math.max(0, wt.endAt - (now||Date.now()));
}
function initWorkTimer(autoStart){
  const sec = currentWorkDuration(), ms = sec * 1000, now = Date.now();
  session.workTimer = {
    endAt: autoStart ? now + ms : null,
    total: ms,
    paused: !autoStart,
    remaining: ms,
    running: !!autoStart,
    lastBeep: 0
  };
}
function workTimerToggle(){
  if(!session) return;
  const now = Date.now();
  if(!session.workTimer){
    initWorkTimer(true);
  } else {
    const wt = session.workTimer;
    if(wt.running && !wt.paused){
      wt.remaining = Math.max(0, wt.endAt - now);
      wt.paused = true;
    } else {
      if(wt.remaining <= 0) wt.remaining = wt.total;
      wt.endAt = now + wt.remaining;
      wt.paused = false;
      wt.running = true;
    }
  }
  ensureAudio();
  saveSession();
  render();
}
function workTimerReset(){
  if(!session) return;
  const sec = currentWorkDuration();
  session.workTimer = {
    endAt: null,
    total: sec * 1000,
    paused: true,
    remaining: sec * 1000,
    running: false,
    lastBeep: 0
  };
  saveSession();
  render();
}
function completeTimedSet(early){
  const s=session; if(!s||s.phase!=='work'||s.rest) return;
  const rot=activeRoutine(), {ex,set}=s.cur, entry=s.logs[ex][set], e=rot[ex];
  touch();
  entry.status='done';
  entry.reps=e.duration || 30;
  entry.sub=(rot===routineChest&&e.id==='pies'&&settings.subPies) ||
            (rot===routineAbs&&e.id==='jumping_jacks'&&settings.absAltJacks) ||
            (rot===routineAbs&&e.id==='v_ups'&&settings.absAltVUps);
  s.workTimer=null;
  s.draft=null;
  vibrate([220,110,220]);
  alertEnd();

  const next=findNext(s,ex,set);
  if(!next){ finishSession(false); return; }
  const restSec=e.rest;
  s.cur=next;
  if(restSec>0){
    startRest(restSec,{ex,set});
    toast('¡Tiempo completado! Comienza descanso');
    announce('Serie completada. Descanso iniciado.');
  } else {
    toast('¡Ejercicio completado!');
    announce('Serie completada.');
  }
  saveSession();
  render();
}

function stopTempo(){ ui.tempo=null; }
function tempoState(now){
  const t=ui.tempo, el=now-t.startAt;
  if(el<0) return {phase:'LISTO',n:Math.ceil(-el/1000),rep:1,key:'lead'};
  const cyc=TEMPO_DOWN+TEMPO_UP, rep=Math.floor(el/cyc)+1, p=el%cyc;
  if(p<TEMPO_DOWN) return {phase:'BAJA',n:Math.ceil((TEMPO_DOWN-p)/1000),rep,key:rep+'d'};
  return {phase:'SUBE',n:Math.ceil((cyc-p)/1000),rep,key:rep+'u'};
}
function tempoTick(now){
  if(!ui.tempo) return;
  const st=tempoState(now);
  const ph=$('#tempoPhase'), c=$('#tempoCount'), r=$('#tempoRep');
  if(ph) ph.textContent=st.phase; if(c) c.textContent=st.n; if(r) r.textContent=st.phase==='LISTO'?'Colócate en posición':'Repetición '+st.rep;
  if(st.key!==ui.tempo.lastKey){
    ui.tempo.lastKey=st.key;
    if(settings.sound&&st.key!=='lead'){ ensureAudio(); beep(st.phase==='BAJA'?520:760,.09,0,.2); }
    vibrate(25);
  }
}

function updateElapsed(){
  const chip=$('#elapsedChip'); if(!chip) return;
  if(session){ chip.classList.add('on'); $('#elapsedTxt').textContent=fmtElapsed(session.activeMs); } else chip.classList.remove('on');
}

function tick(){
  const now=Date.now();
  if(session){
    if(session.phase!=='summary') touch();

    // Descanso
    if(session.rest){
      const r=session.rest;
      if(!r.paused&&now>=r.endAt){
        endRest(now-r.endAt<5000?'alert':'late');
      } else {
        const left=restLeft(now), c=$('#restClock');
        if(c){ const t=fmtClock(left); if(c.textContent!==t) c.textContent=t; }
        const ring=$('#restRing'); if(ring) ring.style.strokeDashoffset=String(CIRC*(1-left/Math.max(r.total,left,1)));
      }
    }

    // Temporizador de ejercicio
    if(!session.rest && session.workTimer && session.workTimer.running && !session.workTimer.paused){
      const wt=session.workTimer;
      const left=Math.max(0, wt.endAt - now);
      wt.remaining=left;
      const c=$('#workClock');
      if(c){ const t=fmtClock(left); if(c.textContent!==t) c.textContent=t; }
      const bar=$('#workBar');
      if(bar){ bar.style.width=Math.round((1 - left/wt.total)*100)+'%'; }

      const secLeft = Math.ceil(left/1000);
      if(secLeft<=3 && secLeft>0 && secLeft!==wt.lastBeep){
        wt.lastBeep = secLeft;
        if(settings.sound){ ensureAudio(); beep(660,.08,0,.15); }
      }

      if(left<=0){
        completeTimedSet(false);
      }
    }

    // Calentamiento
    if(session&&session.phase==='warmup'){
      const w=session.warm, el=warmElapsed(now), total=warmTotalMs();
      if(w.since&&el>=total){ w.ms=total; w.since=null; w.done=true; alertEnd(); announce('Calentamiento completado'); saveSession(); render(); }
      else {
        const idx=warmStepIndex(el);
        if(idx!==ui.warmIdx){ ui.warmIdx=idx; if(w.since&&settings.sound){ ensureAudio(); beep(660,.08,0,.18); } render(); }
        else {
          const c=$('#warmClock'); if(c) c.textContent=fmtClock(total-el);
          const b=$('#warmBar'); if(b) b.style.width=Math.round(el/total*100)+'%';
        }
      }
    }
    if(session&&now-ui.lastSave>15000) saveSession();
  }
  tempoTick(now);
  updateElapsed();
}

function newSession(routineId, phase, usedWarm){
  const now=Date.now();
  const rot = routineFor(routineId);
  return {
    id: uid(),
    routineId,
    routineName: ALL_ROUTINES[routineId].name,
    startedAt: now,
    activeMs: 0,
    lastTouch: now,
    phase,
    warm: {ms:0, since:null, done:false, used:!!usedWarm},
    logs: rot.map(e=>Array.from({length:e.sets},()=>({status:'pending',reps:null,rpe:null,sub:false}))),
    cur: {ex:0,set:0},
    rest: null,
    workTimer: null,
    draft: null,
    early: false,
    saved: false,
    endedAt: null
  };
}

function startSession(routineId, withWarm){

function warmToggle(){
  const w=session.warm, now=Date.now();

  else { if(w.done||w.ms>=warmTotalMs()){ w.ms=0; w.done=false; } w.since=now; }
  saveSession(); render();
}
function warmReset(){ const w=session.warm; w.ms=0; w.since=null; w.done=false; ui.warmIdx=-1; saveSession(); render(); }
function warmFinish(){
  const w=session.warm; if(w.since){ w.ms+=Date.now()-w.since; w.since=null; }
  session.phase='work'; session.lastTouch=Date.now(); ui.warmIdx=-1; saveSession(); render();
}

function finishSession(early){
  const s=session; if(!s) return;
  touch();
  s.phase='summary';
  s.endedAt=Date.now();
  s.early=!!early;
  s.rest=null;
  s.workTimer=null;
  s.draft=null;
  s.saved=false;
  stopTempo();
  alertEnd();
  saveSession();
  ui.view='summary';
  render();
}

function completeSet(){
  const s=session; if(!s||s.phase!=='work'||s.rest) return;
  const rot=activeRoutine(), {ex,set}=s.cur, entry=s.logs[ex][set], e=rot[ex];

  if(e.type==='time'||e.type==='time_sides'){
    completeTimedSet(false);
    return;
  }

  const d=getDraft();
  const inp=$('#repsInput'); if(inp) d.reps=inp.value;
  const reps=parseReps(d.reps);
  const err=$('#repsErr');
  if(reps===null){
    if(err){ err.textContent='Escribe un número de repeticiones válido (1 a 200).'; err.hidden=false; }
    if(inp) inp.focus();
    return;
  }
  touch();
  const wasDone=entry.status==='done';
  entry.status='done';
  entry.reps=reps;
  entry.rpe=d.rpe||null;
  entry.sub=(rot===routineChest&&e.id==='pies'&&settings.subPies) ||
            (rot===routineAbs&&e.id==='v_ups'&&settings.absAltVUps) ||
            (rot===routineAbs&&e.id==='lying_leg_raises'&&settings.absAltLegRaises);
  s.draft=null;
  stopTempo();

  if(wasDone){
    s.cur=firstPending(s)||{ex,set};
    toast('Serie actualizada'); saveSession(); render(); return;
  }

  vibrate(30);
  const next=findNext(s,ex,set);
  if(!next){ finishSession(false); return; }
  const crossing=next.ex!==ex, restSec=e.rest;
  s.cur=next;
  if(restSec>0&&(!crossing||settings.restBetween)) startRest(restSec,{ex,set});
  announce('Serie '+(set+1)+' registrada, '+reps+' repeticiones');
  saveSession(); render();
}

async function skipSet(){
  const s=session; if(!s||s.phase!=='work'||s.rest) return;
  const {ex,set}=s.cur, entry=s.logs[ex][set]; if(entry.status==='done') return;
  const ok=await ask({title:'¿Saltar esta serie?',message:'Se marcará como omitida y podrás volver a ella después.',confirm:'Saltar serie',danger:true});
  if(!ok||!session) return;
  touch();
  entry.status='skipped'; entry.reps=null; entry.rpe=null; s.draft=null; s.workTimer=null; stopTempo();
  const next=findNext(s,ex,set);
  if(!next){ finishSession(false); return; }
  s.cur=next; saveSession(); render();
}

function gotoEx(n){
  const s=session; if(!s) return;
  stopTempo();
  s.workTimer=null;
  const l=s.logs[n]; let k=l.findIndex(x=>x.status!=='done'); if(k<0) k=0;
  s.cur={ex:n,set:k}; s.draft=null; saveSession(); render();
}

function setReps(val){
  const t=editTarget();
  if(t.live){ const n=parseReps(val); if(n===null) return false; t.entry.reps=n; saveSession(); return true; }
  t.draft.reps=val; return true;
}
function setRpe(n){
  const t=editTarget();
  if(t.live){ t.entry.rpe=(t.entry.rpe===n)?null:n; }
  else { t.draft.rpe=(t.draft.rpe===n)?null:n; }
  saveSession(); render();
}
function stepReps(delta){
  const t=editTarget();
  const cur=t.live?t.entry.reps:parseReps(t.draft.reps);
  const n=clamp((cur||0)+delta,1,200);
  if(t.live) t.entry.reps=n; else t.draft.reps=n;
  saveSession(); render();
}
function tempoToggle(){
  if(ui.tempo){ stopTempo(); } else { ensureAudio(); ui.tempo={startAt:Date.now()+TEMPO_LEAD,lastKey:''}; }
  render();
}

function setExField(rotId, idx, key, raw){
  const defRot = ROUTINE_DEFS[rotId] || ABS_ROUTINE;
  const curRot = routineFor(rotId);
  const cfgObj = configFor(rotId);
  const d=defRot[idx], cur=curRot[idx];
  const n=toInt(raw,NaN);
  if(!Number.isFinite(n)) return {ok:false};

  const next={...cur};
  if(key==='sets') next.sets=clamp(n,1,10);
  if(key==='duration') next.duration=clamp(n,5,300);
  if(key==='rest') next.rest=clamp(n,0,600);
  if(key==='repMin'){
    next.repMin=clamp(n,1,100);
    if(next.repMax<next.repMin) next.repMax=next.repMin;
  }
  if(key==='repMax'){
    next.repMax=clamp(n,1,100);
    if(next.repMin>next.repMax) next.repMin=next.repMax;
  }

  cfgObj.routine[d.id]=next;
  if(rotId==='chest') routineChest=buildRoutine(CHEST_ROUTINE,cfgChest);
  else if(rotId==='caf-chest') routineCafChest=buildRoutine(CAF_CHEST_ROUTINE,cfgCafChest);
  else if(rotId==='caf-abs') routineCafAbs=buildRoutine(CAF_ABS_ROUTINE,cfgCafAbs);
  else routineAbs=buildRoutine(ABS_ROUTINE,cfgAbs);
  saveCfg();
  if(session&&session.routineId===rotId){ reconcile(session); saveSession(); }
  return {ok:true};
}

function buildRecord(s){
  const rot = routineFor(s.routineId);
  const exercises=s.logs.map((l,i)=>{
    const item=rot[i], v=exView(s.routineId, i);
    return {
      id: item.id,
      name: v.name,
      type: item.type,
      sub: l.some(x=>x.sub),
      repMin: item.repMin,
      repMax: item.repMax,
      duration: item.duration,
      rest: item.rest,
      sets: l.map(x=>({status:x.status,reps:x.reps,rpe:x.rpe,sub:!!x.sub}))
    };
  });
  return {
    id: s.id,
    routineId: s.routineId,
    routineName: s.routineName,
    startedAt: s.startedAt,
    endedAt: s.endedAt||Date.now(),
    durationSec: Math.round(s.activeMs/1000),
    warmup: !!(s.warm.used&&(s.warm.done||s.warm.ms>=60000)),
    early: !!s.early,
    exercises,
    totals: totalsOf(exercises)
  };
}

function prevRecord(s){
  return history.filter(h=>h.routineId===s.routineId && h.id!==s.id && h.startedAt<s.startedAt)[0] || null;
}

function saveToHistory(silent){
  const s=session; if(!s||s.phase!=='summary') return;
  const rec=sanitizeRecord(buildRecord(s));
  if(!rec){ if(!silent) toast('No se pudo guardar el entrenamiento'); return; }
  const i=history.findIndex(h=>h.id===rec.id);
  if(i>=0) history[i]=rec; else history.push(rec);
  sortHistory(); saveHistory(); s.saved=true; saveSession();
  if(!silent){
    toast(store.ok?'Entrenamiento guardado en tu historial':'Guardado en memoria (navegador bloquea almacenamiento)');
    render();
  }
}

async function exitSummaryIfActive(){
  if(session && session.phase==='summary'){
    if(!session.saved){
      const choice=await showDialog({
        title:'¿Qué quieres hacer con esta sesión?',
        html:'<p>Este resumen todavía no está guardado en tu historial.</p>',
        dismiss:'stay',
        buttons:[
          {label:'Seguir aquí',value:'stay',auto:true},
          {label:'Salir sin guardar',value:'discard',cls:'btn-danger'},
          {label:'Guardar y salir',value:'save',cls:'btn-primary'}
        ]
      });
      if(choice==='stay') return false;
      if(choice==='save') saveToHistory(true);
    }
    session = null;
    saveSession();
  }
  return true;
}

function exportData(){
  const payload={app:'entrenador',version:3,exportedAt:new Date().toISOString(),history,config:{chest:cfgChest,abs:cfgAbs,cafChest:cfgCafChest,cafAbs:cfgCafAbs}};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='entrenador-datos-'+dateStamp()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000); toast('Archivo exportado correctamente');
}
async function copyJson(){
  const txt=JSON.stringify({app:'entrenador',version:3,exportedAt:new Date().toISOString(),history,config:{chest:cfgChest,abs:cfgAbs,cafChest:cfgCafChest,cafAbs:cfgCafAbs}});
  try{ await navigator.clipboard.writeText(txt); toast('JSON copiado al portapapeles'); }catch(e){ toast('Tu navegador no permite copiar; usa «Exportar»'); }
}
async function importData(data){
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.history)?data.history:null);
  if(!arr){ toast('El archivo no contiene un historial válido'); return; }
  const clean=arr.slice(0,2000).map(sanitizeRecord).filter(Boolean);
  if(!clean.length){ toast('No se encontraron sesiones válidas'); return; }
  const choice=await showDialog({title:'Importar registros',dismiss:'cancel',
    html:`<p>Se encontraron <b>${clean.length}</b> sesiones válidas.</p><p class="muted">«Combinar» añade las nuevas sesiones. «Reemplazar» sustituye todo el historial actual.</p>`,
    buttons:[{label:'Cancelar',value:'cancel',auto:true},{label:'Combinar',value:'merge',cls:'btn-primary'},{label:'Reemplazar',value:'replace',cls:'btn-danger'}]});
  if(choice==='merge'){
    const ids=new Set(history.map(h=>h.id)); let added=0;
    clean.forEach(r=>{ if(!ids.has(r.id)){ history.push(r); ids.add(r.id); added++; } });
    sortHistory(); saveHistory(); toast(added+' sesiones añadidas'); render();
  } else if(choice==='replace'){
    history=clean; sortHistory(); saveHistory();
    if(data.config){
      if(data.config.chest) cfgChest=sanitizeCfg(data.config.chest, CHEST_ROUTINE);
      if(data.config.abs) cfgAbs=sanitizeCfg(data.config.abs, ABS_ROUTINE);
      if(data.config.cafChest) cfgCafChest=sanitizeCfg(data.config.cafChest, CAF_CHEST_ROUTINE);
      if(data.config.cafAbs) cfgCafAbs=sanitizeCfg(data.config.cafAbs, CAF_ABS_ROUTINE);
      routineChest=buildRoutine(CHEST_ROUTINE, cfgChest);
      routineAbs=buildRoutine(ABS_ROUTINE, cfgAbs);
      routineCafChest=buildRoutine(CAF_CHEST_ROUTINE,cfgCafChest);
      routineCafAbs=buildRoutine(CAF_ABS_ROUTINE,cfgCafAbs);
      saveCfg();
    }
    toast('Historial reemplazado'); render();
  }
}

/* =====================================================================
   11. VISTAS Y COMPONENTES
   ===================================================================== */
function storageBanner(){
  return store.ok?'':`<div class="card alert" role="alert"><b>${ic('alert')} Almacenamiento no disponible</b><p class="small">Tu navegador bloquea el almacenamiento local. La sesión se mantendrá en esta pestaña mientras esté abierta. Usa «Exportar» en Progreso para respaldar tus datos.</p></div>`;
}

function safetyCard(full){
  return `<section class="card warn" aria-label="Seguridad">
    <b>${ic('alert')} Entrena con seguridad y margen</b>
    <p class="small"><b>Detén el ejercicio si produce dolor:</b> ante cualquier dolor punzante en la zona lumbar, cuello, hombros o pies, para de inmediato.</p>
    <p class="small">Deja <b>1–3 repeticiones en reserva</b> cuando sea posible; la técnica correcta y la constancia importan más que llegar al fallo absoluto.</p>
    ${full?`<p class="small">Respiración: exhala en el esfuerzo y mantén el abdomen activo sin bloquear la respiración.</p>
    <p class="small muted">${esc(CUFF_NOTE)}</p>`:''}
  </section>`;
}

function warmList(cur,el){
  return `<ol class="list steps">${warmSteps().map((s,i)=>{
    const cls=(el!==undefined)?(i<cur?'done':i===cur?'cur':'pend'):'';
    return `<li class="${cls}"><span class="badge sm">${(el!==undefined&&i<cur)?ic('check'):i+1}</span><span class="t"><b>${esc(s.name)}${s.cuff?' <small class="muted">· manguito</small>':''}</b><span>${esc(s.detail)} (${s.sec} s)</span></span></li>`;
  }).join('')}</ol>`;
}

function breadcrumbBar(backTarget, backLabel){
  return `<div class="nav-bar">
    <button class="btn-back" data-act="nav" data-v="${esc(backTarget)}" aria-label="${esc(backLabel)}">${ic('back')} <span>${esc(backLabel)}</span></button>
    <div class="spacer"></div>
    <button class="btn-back" data-act="go-home" aria-label="Ir al menú principal">${ic('home')} <span>Menú principal</span></button>
  </div>`;
}

function viewMainMenu(){
  const totalCompleted = history.length;

  return `<div class="routine-hub stack">
    ${storageBanner()}

    <section class="card hero">
      <div class="hero-banner-grid">
        <div class="stack" style="gap:0.65rem">
          <p class="eyebrow">Centro de entrenamiento personal</p>
          <h1>Entrenador</h1>
          <p class="muted">Elige tu categoría de entrenamiento para comenzar una rutina guiada con temporizadores, series y descansos interactivos.</p>
          <p class="small muted">Las rutinas fortalecen pecho y abdomen; la definición visible depende del conjunto de hábitos y no se puede elegir de qué zona reducir grasa.</p>
          <div class="meta-pills">
            <span class="pill">📚 <b>4 rutinas listas</b></span>
            <span class="pill">⏱ Historial: <b>${totalCompleted} sesiones</b> (${totalMin} min)</span>
          </div>
        </div>

          <div class="hero-visual-item">${sectionIllustration('chest')}<span>Pectorales</span></div>
          <div class="hero-visual-item">${sectionIllustration('abs')}<span>Abdomen</span></div>
          <div class="hero-visual-item">${sectionIllustration('caf')}<span>Gimnasio CAF</span></div>
        </div>
      </div>

      ${activeSess ? `
        <div class="card ok" style="margin-top:0.25rem;border-width:2px">
          <div class="row between wrap">
            <b>${ic('play')} Entrenamiento en curso: ${esc(session.routineName)}</b>
            <span class="badge-tag abs">${fmtElapsed(session.activeMs)}</span>
          </div>
          <p class="small">Ejercicio ${session.cur.ex+1} · Serie ${session.cur.set+1}</p>
          <button class="btn btn-primary btn-xl" data-act="resume-session">${ic('play')} Continuar entrenamiento</button>
        </div>
      ` : ''}
    </section>

    <section class="card row between wrap" aria-label="Instalar en el celular">
      <div><b>Ten Entrenador en tu celular</b><p class="small muted">Añádela a la pantalla de inicio para abrirla como una app.</p></div>
      <button class="btn btn-primary" data-act="install-app" ${deferredInstallPrompt?'':'hidden'}>${ic('download')} Instalar aplicación</button>
      <span class="small muted">En iPhone, abre en Safari y usa Compartir → «Añadir a pantalla de inicio».</span>

    <section class="routine-groups" aria-label="Rutinas por ubicación">
      <div class="routine-group">
        <div class="routine-group-head">
          <div class="routine-group-title">
            <div class="group-badge-svg" aria-hidden="true">${sectionIllustration('chest')}</div>
            <div>
              <h2>Rutinas en casa</h2>
              <span class="small muted">Las rutinas que ya usas · Sin equipo</span>
            </div>
          </div>
        </div>
        ${['chest','abs'].map(id=>routineHubCard(id)).join('')}
      </div>
      <div class="routine-group">
        <div class="routine-group-head">
          <div class="routine-group-title">
            <div class="group-badge-svg" aria-hidden="true">${sectionIllustration('caf')}</div>

function routineHubCard(id){
  const r=ALL_ROUTINES[id], isCaf=id.startsWith('caf-'), isAbs=id.endsWith('abs');
  const thumbDiagram = id==='chest' ? 'normal' : id==='abs' ? 'v_ups' : id==='caf-chest' ? 'caf_chest_press' : 'caf_kb_march';
  return `<button class="card routine-link" data-act="open-routine-detail" data-r="${id}">
    <div class="row between">
      <span class="badge-tag ${isAbs?'abs':'chest'}">${isAbs?'Abdomen':'Pecho'}${isCaf?' · CAF':' · Casa'}</span>
      <span class="small muted">${r.exercisesCount} ejercicios</span>
    </div>
    <div class="routine-card-top">
      <div class="stack" style="gap:0.35rem">
        <h3>${esc(r.name)}</h3>
        <p class="small muted">${esc(r.desc)}</p>
      </div>
      <div class="routine-art" aria-hidden="true">${exerciseDiagram(thumbDiagram, 'left')}</div>
    </div>
    <span class="pill">${esc(r.estDuration)} · ${isCaf?'Equipos CAF documentados':'Sin equipo'}</span>

}

/* ---- Pantalla 2: Vista de Categoría Muscular ---- */

/* ---- Pantalla 3: Detalle y Selección de Rutina ---- */
function viewRoutineDetail(rotId){
